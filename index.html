<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- viewport-fit=cover + safe-area padding: this app is used one-handed on
         a phone, often installed to the home screen where there is no browser
         chrome to absorb the notch/home indicator.

         NO user-scalable=no (#164 R-11). It was here to protect the drag
         gestures, but it never did that job: iOS Safari has ignored the
         attribute since iOS 10, so the only platform it actually restricted
         is Android (#245), whose testers report capture so quiet they are squinting at the
         screen (#359). What does protect the gesture surfaces is each
         declaring its own `touch-action` (3-components.css: `pan-y` on the
         scrub track, `none` on the two drag surfaces), which is scoped to
         those elements instead of disabling pinch for the whole app. Keeping
         it would have blocked the one accommodation a low-vision translator
         can reach without anybody's help.

         This makes the 16px floor on `.name-input` load-bearing everywhere
         rather than only on iOS — see that rule's own comment. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- `--p-cool-950`, the dark floor (`src/app/styles/1-primitives.css`):
         what the OS chrome shows until `installStoredTheme` repaints it from
         the computed token. Pinned to the primitive by `tests/theme.test.ts`;
         the old `#0b0f14` was a value no token ever had. -->
    <meta name="theme-color" content="#0b1016" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>tC Mobile</title>
    <!--
      LAUNCH INTRO. Plain HTML + inline script so it starts before
      `main.tsx` loads: React mounts underneath as usual, on its own
      schedule. The overlay does not wait for the app and the app does not
      wait for it; it runs its full timeline on every page load, even when
      the app underneath is ready sooner.

      This is a static overlay, not a component, so its colours are literal
      hex values with a token comment beside each — the same pattern
      `theme-color` above already uses — rather than a `1-primitives.css` /
      `2-semantic.css` reference (AGENTS.md's colour-primitive rule governs
      `src/`, which this file sits outside of).

      Theme match: `src/lib/theme.ts`'s `readStoredTheme` defaults to "dark"
      on anything unset or unrecognised, and deliberately does NOT read
      `prefers-color-scheme` (#171 — shared phones handed out by a
      facilitator, not the translator's own OS setting). So this reads the
      same `localStorage` key synchronously and falls back to that same
      app default, not to the OS scheme, which would disagree with what
      `installStoredTheme()` is about to paint on a light-OS phone with no
      stored choice.
    -->
    <style>
      #launch-intro {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        /* --p-cool-950 / dark --s-floor (2-semantic.css) — the app's own
           default theme; overwritten inline before paint if the stored
           theme is "light". */
        --li-bg: #0b1016;
        /* dark --s-ink */
        --li-ink: #e7ecf3;
        background: var(--li-bg);
        pointer-events: none;
      }
      /* Never intercepts a tap, for the overlay's whole life — not only
         while it is animating. */
      #launch-intro,
      #launch-intro * {
        pointer-events: none;
      }
      .li-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px; /* --p-space-4 */
      }
      .li-icon {
        width: 120px;
        height: 120px;
        display: block;
      }
      .li-wordmark {
        display: flex;
        flex-wrap: wrap; /* two lines instead of overflow at 320px wide */
        justify-content: center;
        align-items: baseline;
        gap: 0.35em;
        max-width: 280px;
      }
      .li-word {
        /* --p-font-ui */
        font-family:
          system-ui,
          ui-sans-serif,
          -apple-system,
          sans-serif;
        font-weight: 600; /* --p-weight-strong */
        font-size: clamp(20px, 6.5vw, 30px);
        letter-spacing: -0.01em;
        color: var(--li-ink);
        white-space: nowrap;
      }

      @keyframes li-in-left {
        from {
          opacity: 0;
          transform: translateX(-60px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes li-in-right {
        from {
          opacity: 0;
          transform: translateX(60px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      /* Drop, land, one small rebound, settle. The squash on each contact is
         what makes it read as landing rather than stopping. Each segment gets
         its own easing: fall accelerates (ease-in), rebound decelerates
         (ease-out). */
      @keyframes li-drop {
        0% {
          opacity: 0;
          transform: translateY(-90px) scale(1, 1);
          animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45);
        }
        20% {
          opacity: 1;
        }
        52% {
          transform: translateY(0) scale(1.06, 0.92);
          animation-timing-function: cubic-bezier(0, 0.55, 0.45, 1);
        }
        70% {
          transform: translateY(-14px) scale(0.98, 1.02);
          animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45);
        }
        84% {
          transform: translateY(0) scale(1.02, 0.98);
          animation-timing-function: cubic-bezier(0, 0.55, 0.45, 1);
        }
        93% {
          transform: translateY(-3px) scale(1, 1);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1, 1);
        }
      }
      @keyframes li-fadeout {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      /* Three beats, one after another: translationCore, then Mobile, then
         the icon. Beat 1 (0-600ms): translationCore flies in from the left,
         fading in as it moves. */
      .li-word-left {
        animation: li-in-left 600ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      /* Beat 2 (700-1300ms): Mobile flies in from the right. */
      .li-word-right {
        animation: li-in-right 600ms cubic-bezier(0.16, 1, 0.3, 1) 700ms both;
      }
      /* Beat 3 (1400-2250ms): the icon drops, lands with a small squash,
         rebounds once and settles above the words. The origin sits at the
         icon's base so the squash happens where it touches down. */
      .li-icon {
        transform-origin: 50% 100%;
        animation: li-drop 850ms linear 1400ms both;
      }
      /* Hold (2250ms to 2750ms), then the whole overlay fades to reveal the
         app. Total ~3150ms. */
      #launch-intro {
        animation: li-fadeout 400ms ease-out 2750ms both;
      }

      @media (prefers-reduced-motion: reduce) {
        .li-word-left,
        .li-word-right,
        .li-icon {
          animation: none;
          opacity: 1;
          transform: none;
        }
        /* Show the final composition briefly, then fade — no motion. */
        #launch-intro {
          animation: li-fadeout 300ms ease-out 400ms both;
        }
      }
    </style>
  </head>
  <body>
    <div id="launch-intro" aria-hidden="true" role="presentation">
      <div class="li-mark">
        <img
          class="li-icon"
          src="/launch-intro/icon-256.png"
          width="120"
          height="120"
          alt=""
          aria-hidden="true"
        />
        <div class="li-wordmark">
          <span class="li-word li-word-left">translationCore</span>
          <span class="li-word li-word-right">Mobile</span>
        </div>
      </div>
    </div>
    <script>
      // Runs synchronously, before `main.tsx` is even requested, and reads
      // the exact key `src/lib/theme.ts` owns (`THEME_STORAGE_KEY`) so the
      // overlay's background/ink match the theme `installStoredTheme()` is
      // about to paint underneath it. Mirrors that file's default rather than
      // importing it: this document has no build step of its own to share
      // one.
      (function () {
        var THEME_KEY = "tc-mobile.theme";
        var theme = "dark"; // src/lib/theme.ts DEFAULT_THEME
        try {
          var stored = window.localStorage.getItem(THEME_KEY);
          if (stored === "light" || stored === "dark") theme = stored;
          // No `prefers-color-scheme` fallback for anything else: #171
          // decided these are shared, facilitator-issued phones, so the OS
          // setting is deliberately not consulted — matching that exactly is
          // what "the theme the app will paint" means here.
        } catch (e) {
          // `localStorage` throws in some engines (Safari with cookies
          // blocked, some WebViews). `use-theme.ts`'s `readTheme()` falls
          // back to the default for the same reason; mirrored here.
        }
        var overlay = document.getElementById("launch-intro");
        if (!overlay) return;
        if (theme === "light") {
          overlay.style.setProperty("--li-bg", "#f6f8fa"); // --p-cool-050 / light --s-floor
          overlay.style.setProperty("--li-ink", "#101821"); // light --s-ink
        }
        var done = false;
        function cleanup() {
          if (done) return;
          done = true;
          if (overlay && overlay.parentNode)
            overlay.parentNode.removeChild(overlay);
        }
        // The overlay's OWN fade-out is the last animation to end; children's
        // animationend events bubble here too, so this is filtered to the
        // overlay element itself rather than removing on the first child to
        // finish.
        overlay.addEventListener("animationend", function (e) {
          if (e.target === overlay) cleanup();
        });
        // Safety net: never leaves the overlay stuck, whatever the animation
        // timeline above does or however a WebView schedules it.
        setTimeout(cleanup, 4000);
      })();
    </script>
    <div id="root"></div>
    <!--
      OLD-ENGINE CHECK (#1944). A classic script, ES5 syntax only, so a very
      old WebView can parse it. It runs before the module bundle (module
      scripts are deferred until the document is parsed, wherever Vite puts
      the tag), feature-detects, and uses no timeout.

      Why it exists: the build targets Chrome 111 (`vite.config.ts`
      `build.target`) and does not polyfill. On Android System WebView 91 the
      bundle threw `Object.hasOwn is not a function` before React mounted, so
      the person saw an empty page, and `error-boundary.tsx` and the failure
      log, which live in that bundle, never ran. The build target does NOT
      change.

      When a feature is missing it removes `#launch-intro` and `#root`, then
      draws a plain screen: a picture first (the people who see it may not
      read), one sentence, nothing to tap. With `#root` gone, `main.tsx`
      throws at its first line and nothing mounts. When every feature is
      present it does nothing visible.

      FEATURES lists only built-ins the bundle is known to use, each with the
      Chrome version that added it. BUILT_FOR_CHROME is the Chrome number in
      `vite.config.ts`'s `build.target`; `tests/old-webview-check.test.ts`
      fails when the two differ, so raising the target cannot leave this
      check behind, and when a feature's `since` is above BUILT_FOR_CHROME.

      Every entry must also exist in Safari/iOS 15.4, the other floor in that
      target: this check must never block an iPhone. `Object.hasOwn` is in
      Safari 15.4, `crypto.randomUUID` in 15.4 and `replaceAll` in 13.1.
      `tests/dist-old-webview-features.test.ts` scans the built bundle for
      post-Chrome-85 built-ins and fails when one is used that is not listed.
      A built-in the bundle uses that iOS 15.4 lacks is not listed here.
      `crypto.randomUUID` exists only in a secure context, so it is required
      only where the page is one (a plain-http LAN page is not a WebView
      problem).

      The sentence is English only. This runs before any app code, so it
      cannot read `lib/strings.ts` or the locale tables, and no translation
      of it has been made. Colours are literal hex values with a token
      comment beside each, the pattern `#launch-intro` above uses, because the
      stylesheets are part of the bundle that may not run. No failure-log
      row: the log is IndexedDB code in that same bundle. Works offline: it is
      inline, so the precached `index.html` carries it; the Capacitor shells
      load this same file.
    -->
    <script id="old-webview-check">
      (function () {
        var BUILT_FOR_CHROME = 111;
        var FEATURES = [
          {
            name: "Object.hasOwn",
            since: 93,
            present: typeof Object.hasOwn === "function",
          },
          {
            name: "crypto.randomUUID",
            since: 92,
            present:
              window.isSecureContext === false ||
              (typeof crypto !== "undefined" &&
                typeof crypto.randomUUID === "function"),
          },
          {
            name: "String.prototype.replaceAll",
            since: 85,
            present: typeof String.prototype.replaceAll === "function",
          },
        ];
        var missing = false;
        for (var i = 0; i < FEATURES.length; i++) {
          if (!FEATURES[i].present) missing = true;
        }
        if (!missing) return;

        var dark = true; // src/lib/theme.ts DEFAULT_THEME
        try {
          if (window.localStorage.getItem("tc-mobile.theme") === "light")
            dark = false;
        } catch (e) {
          // localStorage can throw in some WebViews; keep the app default.
        }
        var floor = dark ? "#0b1016" : "#f6f8fa"; // --s-floor
        var ink = dark ? "#e7ecf3" : "#101821"; // --s-ink
        var accent = dark ? "#f0b24a" : "#a35f14"; // --s-warn-text / --s-warn

        var intro = document.getElementById("launch-intro");
        if (intro && intro.parentNode) intro.parentNode.removeChild(intro);
        var root = document.getElementById("root");
        if (root && root.parentNode) root.parentNode.removeChild(root);

        var screen = document.createElement("div");
        screen.id = "old-webview-screen";
        screen.setAttribute("role", "alert");
        screen.style.cssText =
          "position:fixed;top:0;right:0;bottom:0;left:0;display:flex;" +
          "flex-direction:column;align-items:center;justify-content:center;" +
          "padding:24px;text-align:center;box-sizing:border-box;" +
          "font-family:system-ui,sans-serif;font-size:20px;line-height:1.4;" +
          "background:" +
          floor +
          ";color:" +
          ink +
          ";";
        screen.innerHTML =
          '<svg width="160" height="160" viewBox="0 0 160 160" aria-hidden="true" ' +
          'fill="none" stroke="' +
          ink +
          '" stroke-width="6" ' +
          'stroke-linecap="round" stroke-linejoin="round">' +
          '<rect x="44" y="12" width="72" height="136" rx="12"/>' +
          '<line x1="68" y1="132" x2="92" y2="132"/>' +
          '<path stroke="' +
          accent +
          '" d="M80 100V52M62 70l18-18 18 18"/>' +
          "</svg>" +
          '<p style="margin:24px 0 0;max-width:20em">' +
          "Update Android System WebView in Google Play, then open tC Mobile again." +
          "</p>";
        document.body.appendChild(screen);
      })();
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
