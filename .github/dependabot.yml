# Dependency updates. The CI `npm audit` step is a hard gate, so an upstream
# advisory blocks every PR until it is patched; these grouped weekly PRs are the
# update path that keeps that gate cheap to clear. The github-actions ecosystem
# also keeps the SHA-pinned actions in ci.yml current (their `# vX.Y.Z` comments
# are bumped alongside the digest).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        # Majors (e.g. checkout v6 -> v7) can change action behaviour, so keep
        # them out of the weekly digest PR; they get their own review.
        update-types:
          - minor
          - patch

  # The fastlane TestFlight pipeline's gems (#262). `npm audit` in ci.yml does
  # not cover Ruby, so without this a fastlane advisory would open no PR.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bundler:
        patterns:
          - "*"
        # Majors can break fastlane on a billed macOS run (the only place these
        # gems execute), so keep them out of the weekly digest like the actions
        # group above; they get their own review.
        update-types:
          - minor
          - patch
    ignore:
      # CFPropertyList 3.0.9 declares required_ruby_version < 3.2 and breaks the
      # frozen install on the macos-14 runner (Ruby 3.3.12). Pinned to 3.0.8 in
      # the Gemfile; a weekly patch bump to 3.0.9 would silently re-break the
      # TestFlight lane, since ci.yml never runs bundle install (#262).
      - dependency-name: CFPropertyList
