name: Incident report
description: Recordings lost, a shipped build broken, or a release that did not deploy
labels: ["bug"]
body:
  - type: textarea
    id: timeline
    attributes:
      label: Timeline
      description: What happened, in order, with times in UTC.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who was affected, on which platform and build, and whether any recording or data was lost.
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: Cause
      description: Why it happened. Mark what was observed and what is inferred.
    validations:
      required: true
  - type: textarea
    id: resolution
    attributes:
      label: Resolution
      description: What fixed it, or what is still open. A rollback after a schema bump needs its own line (AGENTS.md, "A rollback is not free").
    validations:
      required: true
  - type: textarea
    id: prevention
    attributes:
      label: Prevention
      description: The test, check or runbook change that stops this class of failure.
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related issues and PRs
