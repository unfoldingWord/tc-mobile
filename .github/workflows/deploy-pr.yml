name: Deploy PR

# Per-PR ephemeral Workers, one per open PR (`tc-mobile-pr-<N>`), so concurrent
# PRs don't clobber each other. `cleanup-pr.yml` deletes them on close.
#
# This matters more here than on a typical web app: the only way to genuinely
# test this project is to open it on a phone, and getUserMedia requires a
# secure context — so every PR needs its own HTTPS URL, not a localhost run.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"

concurrency:
  group: deploy-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ephemeral Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      WORKER_NAME: ${{ github.event.pull_request.number && format('tc-mobile-pr-{0}', github.event.pull_request.number) || 'tc-mobile-dev' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Type check before build: Vite strips types, so a tsc error would not
      # fail `npm run build` on its own and a broken build could reach a
      # reviewer's phone looking fine.
      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Deploy
        # --name overrides the top-level worker name; the assets-only config
        # is otherwise identical across environments.
        run: npx wrangler deploy --name "$WORKER_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment the deploy URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          WORKER_NAME: ${{ env.WORKER_NAME }}
        with:
          script: |
            const name = process.env.WORKER_NAME;
            const url = `https://${name}.unfoldingword.workers.dev`;
            const body = [
              `### PR deployment ready`,
              ``,
              `**Worker:** \`${name}\``,
              `**URL:** ${url}`,
              ``,
              `Open it on a phone — HTTPS, so the microphone works. Add it to the home screen to test the installed PWA.`,
              ``,
              `Updated on every push to this PR; removed when the PR closes.`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === "Bot" && c.body.includes("PR deployment ready")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
