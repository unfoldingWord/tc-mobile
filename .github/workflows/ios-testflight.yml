name: iOS TestFlight

# AUTOMATIC on a promotion, manual otherwise (#1281). This is a NATIVE build
# (Capacitor → TestFlight), not a web deploy: it produces an .ipa on a macOS
# runner and uploads it to App Store Connect. It holds no Cloudflare
# credentials and deploys no PWA, so it does not collide with Cloudflare
# Workers Builds (which owns the PWA deploy — AGENTS.md) even though both fire
# on the same promotion merge, and it adds no required check to normal PRs.
#
# Triggers:
#   push to `staging` or `main`  — builds only when the pushed tip is a
#                                  promotion merge (`Merge pull request #N from
#                                  unfoldingWord/release/*`, or `…/staging` for
#                                  the production promotion); any other push
#                                  to those branches ends at preflight with a
#                                  notice and no build.
#   workflow_dispatch            — a manual rebuild of `staging` or `main`.
#                                  No other ref is accepted: the former
#                                  `allow_any_ref` input is gone (#1281, DRI
#                                  pick 2026-09-30).
#
# macOS runners bill at a premium, so the trigger is deliberate — only a
# promotion merge or an explicit dispatch spends one — and the lane does not
# wait for Apple's server-side processing (see the Fastfile).
#
# One-time setup lives in docs/native/README.md §4a: the seven secrets below
# (in the `release-signing` environment, whose deployment-branch policy is the
# actor guard — #1281, replacing the required reviewer of #321), the App Store
# Connect app record, and the API key's role.
on:
  push:
    branches: ["staging", "main"]
  workflow_dispatch:

permissions: {}

concurrency:
  # One upload at a time; never cancel an in-flight archive/upload.
  group: ios-testflight
  cancel-in-progress: false

jobs:
  # A cheap ubuntu gate BEFORE the environment and the billed macOS runner. It
  # decides whether this event is one that builds: a promotion merge landing
  # on staging/main, or a manual rebuild dispatched from one of those two
  # branches (this is the first path that puts a build on a tester's phone).
  # Anything else on a push ends here with a notice (no red X — the Play
  # lane's "disabled" shape); a dispatch from any other ref is refused. This
  # job holds NO secrets and no environment on purpose: the signing secrets
  # live in the `release-signing` environment, which only the macOS job
  # references. This check is the mistake guard; the environment's
  # deployment-branch policy is the actor guard — a branch that rewrites
  # this file cannot reach the secrets, whatever it writes here (#1281).
  preflight:
    name: Preflight (promotion or dispatch)
    # Pinned like the Android preflight: `ubuntu-latest` retargets silently,
    # and this job now runs on every push to staging/main.
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      build: ${{ steps.gate.outputs.build }}
    env:
      EVENT: ${{ github.event_name }}
      REF: ${{ github.ref_name }}
      # ref_name drops the branch-or-tag distinction: a TAG named `staging`
      # would read as "staging". Require the ref to be a branch as well.
      REF_TYPE: ${{ github.ref_type }}
      # The pushed tip's full commit message; empty on a dispatch. Passed
      # through env and never interpolated into the script: a commit message
      # is free text.
      HEAD_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Build a promotion merge, or a dispatch from staging/main
        id: gate
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "branch" ] || { [ "$REF" != "staging" ] && [ "$REF" != "main" ]; }; then
            echo "::error::Refusing to build a tester IPA from $REF_TYPE '$REF'. Tester builds come from the staging or main BRANCH; promote, or dispatch from one of those two."
            exit 1
          fi
          case "$EVENT" in
            workflow_dispatch)
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "Manual rebuild of '$REF'."
              ;;
            push)
              # The merge commit GitHub writes for a promotion PR. `release/*`
              # is the pinned RC/release ref promoted to staging; `staging` is
              # the production promotion to main. Only the subject line is read.
              subject="${HEAD_MESSAGE%%$'\n'*}"
              # A carriage return would end the log line early; keep the echo
              # below one line that starts with its prefix.
              subject="${subject//$'\r'/}"
              promotion='^Merge pull request [#][0-9]+ from unfoldingWord/(release/|staging$)'
              echo "Subject: $subject"
              if [[ "$subject" =~ $promotion ]]; then
                echo "build=true" >> "$GITHUB_OUTPUT"
                echo "Promotion merge on '$REF': building."
              else
                echo "::notice::Not a promotion merge on '$REF'; no native build. Dispatch the lane for a manual rebuild."
                echo "build=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::error::Unexpected event '$EVENT' for this lane."
              exit 1
              ;;
          esac

  testflight:
    name: Build and upload to TestFlight
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    # The signing secrets are ENVIRONMENT secrets, not repository secrets. The
    # environment's deployment-branch policy (#1281's target state; until the
    # DRI has run its runbook, the #321 required reviewer still gates every
    # run) admits only `staging` and `main`. A job on any other ref is
    # refused by GitHub before any step runs, however that ref's copy of this
    # file was edited — the actor guard the in-yml check above cannot be
    # (#321: any push-access branch can rewrite the yml). Code reaches staging/main only by admin merge
    # (ruleset 24043869), so only admin-merged code reaches the secrets
    # (#1281).
    environment: release-signing
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # The Fastfile reads IOS_DIST_CERT_PASSWORD directly from ENV to unlock
      # the imported .p12; the p12 and profile themselves are decoded in the
      # "Write signing credentials" step and not needed as env vars here.
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
    steps:
      # First step, before checkout: an unset environment secret expands to "",
      # which the Fastfile's `ENV.fetch` would NOT catch, so treat empty as
      # missing and fail in seconds rather than ~10 minutes into the archive.
      # Step-scoped env so the base64 blobs are not job-wide.
      - name: Require all seven secrets
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID ASC_KEY_P8_BASE64 \
                      IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISION_PROFILE_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::environment secret $name is unset or empty (environment: release-signing)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All seven signing secrets present."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle
        run: npm run build

      # These checks enforce the reader-gated OBS glob policy. The synced
      # bundle guard below also checks what the build actually precaches.
      - name: Check the built artifacts
        run: npm run test:dist

      # The OBS-thumbnail-vs-jpg-policy comparison below has to run against
      # THIS (web) build, before the native rebuild two steps down replaces
      # dist/sw.js with vite-plugin-pwa's self-destroying worker (#923) —
      # that worker never precaches anything at all, by design, so comparing
      # IT against globPatterns would either compare two things that can
      # never agree once jpg is legitimately restored (Template Library,
      # #33), or silently stop meaning anything. This is that same check,
      # simply moved earlier; "Guard the synced bundle" below keeps the
      # checks that are actually about what got synced into ios/.
      - name: OBS thumbnail precache policy (web build; #177 / ADR 0006)
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = readFileSync('vite.config.ts', 'utf8');
          const body = config.match(/globPatterns:\s*\[([^\]]*)\]/)?.[1];
          const patterns = [...(body ?? '').matchAll(/"([^"]+)"/g)].map(m => m[1]);
          if (patterns.length === 0) {
            console.error('::error::No globPatterns found in vite.config.ts');
            process.exit(1);
          }
          const jpgConfigured = patterns.some(p => /\bjpe?g\b/i.test(p));
          const thumbnailsEmitted = readFileSync('dist/sw.js', 'utf8').includes('obs/thumbs');
          if (thumbnailsEmitted !== jpgConfigured) {
            console.error('::error::Emitted OBS thumbnails disagree with the reader-gated jpg policy');
            process.exit(1);
          }
          NODE

      # #923: the web build above (and its two checks) validate the PWA's own
      # artifacts, but what actually ships inside the native shell must be the
      # NATIVE-mode build — vite.config.ts's `--mode native` swaps `dist/sw.js`
      # for vite-plugin-pwa's self-destroying worker and ships no
      # auto-injected registration script, so the WebView never keeps an
      # offline precache that can go stale across an in-place upgrade. This
      # rebuild deliberately overwrites the dist/ the previous steps just
      # validated; `cap sync` below copies whatever dist/ holds at that
      # point, which must be this one, not the web build's.
      - name: Rebuild and check dist/ for the native shell (self-destroying service worker, #923)
        run: npm run test:dist:native

      # Select Xcode BEFORE `cap sync`: the iOS sync resolves the CapApp-SPM
      # Swift package through xcodebuild, so it must use the same toolchain gym
      # archives with, or SPM resolves against one Xcode and the archive runs on
      # another. Target the iOS 26 SDK for App Store Connect uploads, choosing
      # the newest stable Xcode 26 by numeric version rather than relying on
      # the runner image default. Fail closed if no matching application exists.
      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | ruby -e '
            paths = STDIN.readlines.map(&:chomp)
            candidates = paths.select { |p| p.match?(%r{/Xcode_26(?:\.\d+)*\.app\z}) }
            puts candidates.max_by { |p| Gem::Version.new(p[/Xcode_([\d.]+)\.app\z/, 1]) }
          ' || true)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26 not found on this runner. Available versions:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none)"
            exit 1
          fi
          sudo xcode-select -s "${XCODE}/Contents/Developer"
          xcodebuild -version

      - name: Sync dist/ into the iOS project
        run: npx cap sync ios

      # This is the first path that puts dist/ on testers' phones, and a
      # manual dispatch can rebuild a ref whose ci.yml run was not consulted.
      # Re-assert its cheap ship-blockers here — a missing service worker or
      # manifest, or a leaked e2e harness — plus that cap sync actually copied
      # the bundle (ios/App/App/public is gitignored; a sync that exits 0 without
      # it would archive a blank WebView). The OBS-thumbnail policy is checked
      # against the WEB build above, not here — see that step's comment.
      - name: Guard the synced bundle
        run: |
          set -euo pipefail
          test -f dist/sw.js || { echo "::error::dist/sw.js missing"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "::error::manifest missing"; exit 1; }
          for tok in "e2e-harness" "__e2e"; do
            if grep -rq "$tok" dist/; then
              echo "::error::e2e harness ($tok) leaked into dist/"
              exit 1
            fi
          done
          test -f ios/App/App/public/index.html || { echo "::error::cap sync did not copy the web bundle into ios/"; exit 1; }
          echo "Bundle built, clean, and synced into ios/."

      # The .p8 never touches the repo. It is decoded from a secret into the
      # gitignored fastlane/AuthKey.p8 that the Fastfile reads.
      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        # Decode with Ruby (preinstalled on the macOS runner), not `base64`: the
        # decode flag differs by platform (`--decode`/`-d` is GNU, `-D` is the
        # BSD `base64` this runner ships), and `Base64.decode64` also tolerates a
        # wrapped secret. Reading the secret from ENV keeps it out of the process
        # arguments and the shell history.
        # The first step of this job already failed the run if this secret is unset/empty.
        run: |
          set -euo pipefail
          ruby -rbase64 -e 'File.binwrite("fastlane/AuthKey.p8", Base64.decode64(ENV.fetch("ASC_KEY_P8_BASE64")))'

      # The signing credentials never touch the repo. Decoded here from secrets
      # into gitignored paths that the Fastfile reads. Same Ruby decode technique
      # as the API key step above: cross-platform, tolerates wrapped secrets,
      # keeps the secrets out of process arguments and shell history.
      - name: Write the signing credentials
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          ruby -rbase64 -e 'File.binwrite("fastlane/dist_cert.p12", Base64.decode64(ENV.fetch("IOS_DIST_CERT_P12_BASE64")))'
          ruby -rbase64 -e 'File.binwrite("fastlane/dist_profile.mobileprovision", Base64.decode64(ENV.fetch("IOS_PROVISION_PROFILE_BASE64")))'

      - name: Install fastlane
        # `frozen` fails the run if Gemfile.lock does not satisfy the Gemfile
        # instead of silently re-resolving, so every run installs exactly the
        # locked gem set. It is set through `bundle config` rather than the
        # `--frozen` flag: bundler 2.6 deprecates the flag because it "relies on
        # being remembered across bundler invocations", which a future runner
        # image could stop doing without any change here — the config form is
        # explicit per checkout. The first real dispatch (run 34694213885,
        # 2026-09-12) proved the guard works: it refused a lock resolved under a
        # pre-3.2 Ruby (CFPropertyList 3.0.9, `ruby < 3.2`) on the runner's
        # 3.3.12 instead of quietly re-resolving. Bundler is pinned to the lock's
        # `BUNDLED WITH` so it never rewrites the lock underneath us. Install
        # into vendor/bundle (not the system gem dir, which is often not
        # writable on the runner).
        run: |
          set -euo pipefail
          gem install bundler -v 2.6.9 --no-document
          bundle _2.6.9_ config set --local path vendor/bundle
          bundle _2.6.9_ config set --local frozen true
          bundle _2.6.9_ install --jobs 4 --retry 3

      - name: Archive and upload to TestFlight
        # Same pinned bundler as the install step, so both invocations agree.
        run: bundle _2.6.9_ exec fastlane ios beta

      - name: Remove decoded credentials
        # Runner state is ephemeral, but do not leave decoded secrets on disk
        # between steps once the lane is done.
        if: always()
        run: rm -f fastlane/AuthKey.p8 fastlane/dist_cert.p12 fastlane/dist_profile.mobileprovision
