name: iOS TestFlight

# Manual only. This is a NATIVE build (Capacitor → TestFlight), not a web
# deploy: it produces an .ipa on a macOS runner and uploads it to App Store
# Connect. It never runs on push/PR, so it does not collide with Cloudflare
# Workers Builds (which owns the PWA deploy — AGENTS.md) and adds no required
# check to normal PRs. Run it from the Actions tab when a build is wanted;
# `workflow_dispatch` builds whatever ref you pick there.
#
# macOS runners bill at a premium, so the trigger is deliberate and the lane
# does not wait for Apple's server-side processing (see the Fastfile).
#
# One-time setup lives in docs/native/README.md §4a: the four secrets below,
# the App Store Connect app record, and the API key's role.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  # One upload at a time; never cancel an in-flight archive/upload.
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle
        run: npm run build

      - name: Sync dist/ into the iOS project
        run: npx cap sync ios

      # Select the newest Xcode installed on the image rather than pin an action
      # or a version that drifts as the runner image updates. Every other
      # workflow here uses only actions/* pinned by SHA; a one-line shell select
      # keeps that "no third-party action" property (see ci.yml).
      - name: Select the latest Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      # The .p8 never touches the repo. It is decoded from a secret into the
      # gitignored fastlane/AuthKey.p8 that the Fastfile reads.
      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_P8_BASE64:-}" ]; then
            echo "::error::ASC_KEY_P8_BASE64 secret is empty"
            exit 1
          fi
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > fastlane/AuthKey.p8

      - name: Install fastlane
        run: |
          set -euo pipefail
          gem install bundler --no-document
          bundle install --jobs 4 --retry 3

      - name: Archive and upload to TestFlight
        run: bundle exec fastlane ios beta

      - name: Remove the API key
        # Runner state is ephemeral, but do not leave the decoded key on disk
        # between steps once the lane is done.
        if: always()
        run: rm -f fastlane/AuthKey.p8
