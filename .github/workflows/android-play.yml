name: Android → Google Play

# AUTOMATIC native lane: every push to `staging` or `main` builds a signed
# Android App Bundle (.aab) and uploads it to a Google Play track.
#
#   staging → Internal testing   (vars.PLAY_TRACK_STAGING, default "internal")
#   main    → Closed testing     (vars.PLAY_TRACK_MAIN,    default "alpha")
#
# Promotion to Production is a deliberate, manual step in Play Console.
#
# This is a NATIVE build, not a web deploy. Cloudflare Workers Builds still
# owns the PWA (AGENTS.md); this lane never touches Cloudflare and needs no
# Cloudflare credentials, so the two do not collide even though both fire on
# the same merges.
#
# Signing: the bundle is signed with the Play UPLOAD key, not the app signing
# key. Google holds the app signing key (Play App Signing) and re-signs what
# Play delivers. Because an upload key can be reset in Play Console if it
# leaks, it is safe to hold it in an environment WITHOUT required reviewers —
# unlike the app signing keystore in `release-signing`, which is permanent app
# identity. The `play-upload` environment is instead restricted to the
# `staging` and `main` branches (Settings → Environments → Deployment
# branches), which is what keeps a feature branch that rewrites this file from
# reaching its secrets. Setup: docs/native/play-store.md.
#
# Off by default: until vars.PLAY_UPLOAD_ENABLED is "true", a push runs only
# the preflight job and reports that the lane is disabled (no red X).
on:
  push:
    branches: ["staging", "main"]
    # Mirror Cloudflare's Exclude paths: a docs-only merge ships no new code.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build and sign the .aab but do not upload it (for the first, manual Play Console upload)."
        type: boolean
        default: false

permissions: {}

jobs:
  preflight:
    name: Preflight (branch → track)
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      track: ${{ steps.plan.outputs.track }}
      status: ${{ steps.plan.outputs.status }}
    env:
      REF: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
      ENABLED: ${{ vars.PLAY_UPLOAD_ENABLED }}
      # A build_only dispatch runs even while the lane is disabled: that is how
      # the first .aab is produced for the manual upload Play requires before
      # its API will accept one (docs/native/play-store.md §5).
      BUILD_ONLY: ${{ inputs.build_only }}
      TRACK_STAGING: ${{ vars.PLAY_TRACK_STAGING || 'internal' }}
      TRACK_MAIN: ${{ vars.PLAY_TRACK_MAIN || 'alpha' }}
      # "draft" until the app has been published once; Play rejects any other
      # status on a never-published app. Flip the variable to "completed" after
      # the first manual rollout (docs/native/play-store.md §6).
      STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
    steps:
      - name: Map branch to Play track
        id: plan
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "branch" ]; then
            echo "::error::Play uploads come from the staging or main BRANCH, not $REF_TYPE '$REF'."
            exit 1
          fi
          case "$REF" in
            staging) track="$TRACK_STAGING" ;;
            main)    track="$TRACK_MAIN" ;;
            *) echo "::error::Refusing to upload '$REF' to Play. Only staging and main publish."; exit 1 ;;
          esac
          # Production is promoted by hand in Play Console, never by this lane;
          # and the track must be one token, since it is written to GITHUB_OUTPUT.
          case "$track" in
            ""|*[!A-Za-z0-9._-]*) echo "::error::Play track must be a single token, got '$track'."; exit 1 ;;
          esac
          if [ "$(printf '%s' "$track" | tr '[:upper:]' '[:lower:]')" = "production" ]; then
            echo "::error::Refusing Play track '$track'. Promote to production in Play Console."
            exit 1
          fi
          case "$STATUS" in
            draft|completed) ;;
            *) echo "::error::vars.PLAY_RELEASE_STATUS must be draft or completed, got '$STATUS'."; exit 1 ;;
          esac
          if [ "$ENABLED" != "true" ] && [ "${BUILD_ONLY:-}" != "true" ]; then
            echo "::notice::Play upload lane is disabled (vars.PLAY_UPLOAD_ENABLED != 'true'). See docs/native/play-store.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
          echo "track=$track" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "$REF → Play track '$track' (release status '$STATUS')."

  upload:
    name: Build .aab and upload to Play (${{ needs.preflight.outputs.track }})
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    # Branch-restricted environment, no required reviewers (see header).
    environment: play-upload
    # One upload for this Play app at a time, across BOTH branches: staging
    # and main share one package and one service account, a second Play edit
    # invalidates the first, and versionCode (date +%s) must increase per
    # app, not per track. So the group carries the lane alone, no ref and no
    # commit. Never cancel an in-flight upload. The group is on THIS job, not
    # the workflow (#1616), the same as android-apk.yml and
    # ios-testflight.yml: a run whose preflight decided not to upload (the
    # lane disabled) never enters it, so it cannot replace a pending upload
    # (GitHub keeps one pending run per group and replaces it with a newer
    # one). Two uploads queued behind an in-flight one still leave only the
    # newer pending: read a `cancelled` run against the branch tip (#1308).
    # The group serializes; it does not refuse. A second run of the same
    # commit waits here, and then the upload guard step below finds the
    # first run's upload and skips its own (#1616).
    concurrency:
      group: android-play
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # actions: read is for the upload guard's reads (#1616).
    permissions:
      contents: read
      actions: read
    env:
      # Store builds are never diagnostic builds; build.gradle compares this to
      # the synced capacitor.config.json, so it must be explicit.
      TC_ANDROID_DIAGNOSTIC: "false"
    steps:
      - name: Require the signing secrets
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_STORE_PASSWORD \
                      PLAY_UPLOAD_KEY_ALIAS PLAY_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::environment secret $name is unset or empty (environment: play-upload)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All four signing secrets present."

      # build_only (workflow_dispatch-only) builds and signs the .aab but
      # never uploads it, so it needs no Play API credential. inputs.build_only
      # is empty on a push, so a push takes this branch too — same as an
      # explicit build_only:false dispatch.
      - name: Require the Play service-account secret
        if: ${{ !inputs.build_only }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::environment secret PLAY_SERVICE_ACCOUNT_JSON is unset or empty (environment: play-upload)"
            exit 1
          fi
          echo "Play service-account secret present."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "npm"

      # #1616, the pre-upload guard. This job holds the lane's concurrency
      # group, so no other upload of this lane runs beside it. The step asks
      # check:redispatch's core (scripts/redispatch-core.mjs, guardUpload)
      # whether a run of this lane at this commit, or an earlier attempt of
      # this run, already uploaded. SKIP leaves the job green with a notice
      # and no upload; a failed or cancelled earlier run never blocks. A read
      # it cannot settle fails the job before any upload: the core's rule is
      # that anything the reads cannot settle is a stop, never a guess.
      #
      # #1674: every step after this one carries the verdict in its `if:`, so a
      # SKIP runs no prep (npm ci, builds, key writes) and cannot turn red on one.
      # build_only skips this step, so the prep gate there is
      # `inputs.build_only || steps.guard.outputs.upload == 'true'`.
      - name: Skip the upload if this commit already uploaded on this lane
        id: guard
        if: ${{ !inputs.build_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: play
        run: |
          set -uo pipefail
          out="$(node scripts/check-redispatch.mjs --lane "$LANE" --sha "$GITHUB_SHA" --branch "$GITHUB_REF_NAME" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT")" && status=0 || status=$?
          printf '%s\n' "$out"
          # The verdict is the first UPLOAD/SKIP/STOP line; a failed read can
          # print more lines after it.
          verdict="$(printf '%s\n' "$out" | grep -m 1 -E '^(UPLOAD|SKIP|STOP): ' || true)"
          case "$status" in
            0) echo "upload=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "::notice::$verdict. This run uploads nothing and ends green."
              echo "upload=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::${verdict:-STOP: the guard printed no verdict}. Nothing was uploaded. Run npm run check:redispatch for this lane and commit, and tell the DRI."
              exit 1
              ;;
          esac

      # Same JDK pin as android-apk.yml: Capacitor's generated gradle compiles
      # at Java 21 and the runner image defaults to 17.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: ${{ inputs.build_only || steps.guard.outputs.upload == 'true' }}
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu-24.04 image's system Ruby is 3.2, and the locked fastlane
      # gems need 3.3 or newer (excon 1.7.1 declares `ruby >= 3.3.0`). The
      # iOS lane's macOS runner already ships 3.3. No `bundler-cache`: the
      # "Install fastlane" step pins bundler and installs the frozen lock
      # itself, after the checks below and before any secret reaches disk.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: ${{ inputs.build_only || steps.guard.outputs.upload == 'true' }}
        with:
          ruby-version: "3.3"

      - name: Assert the toolchain this project compiles against
        if: ${{ inputs.build_only || steps.guard.outputs.upload == 'true' }}
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is unset on this runner image}"
          test -d "$ANDROID_HOME/platforms/android-36" \
            || { echo "::error::Android SDK Platform 36 not found under $ANDROID_HOME/platforms"; ls "$ANDROID_HOME/platforms" || true; exit 1; }
          test -d "$ANDROID_HOME/build-tools/36.0.0" \
            || { echo "::error::Android Build-tools 36.0.0 not found under $ANDROID_HOME/build-tools"; ls "$ANDROID_HOME/build-tools" || true; exit 1; }
          command -v ruby >/dev/null \
            || { echo "::error::ruby not on PATH; the decode steps and fastlane need it"; exit 1; }
          java -version 2>&1 | head -1

      - name: Install dependencies
        if: ${{ inputs.build_only || steps.guard.outputs.upload == 'true' }}
        run: npm ci

      # Installed here, before any Play secret reaches disk (the "Write the
      # upload keystore" and "Write the Play service-account key" steps,
      # below): a gem install hook runs arbitrary code, and neither the
      # bundler install nor fastlane itself needs the keystore or the
      # service-account JSON — only the upload step later does.
      - name: Install fastlane
        if: ${{ !inputs.build_only && steps.guard.outputs.upload == 'true' }}
        run: |
          set -euo pipefail
          gem install bundler -v 2.6.9 --no-document --user-install
          export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH"
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"
          bundle _2.6.9_ config set --local path vendor/bundle
          bundle _2.6.9_ config set --local frozen true
          bundle _2.6.9_ install --jobs 4 --retry 3

      - name: Build the web bundle
        if: ${{ inputs.build_only || steps.guard.outputs.upload == 'true' }}
        run: npm run build

      # ci.yml's fourth ship-blocker, checked against THIS (web) build, before
      # the native rebuild two steps down replaces dist/sw.js with
      # vite-plugin-pwa's self-destroying worker (#923): that worker never
      # precaches anything at all, by design, so this grep would trivially
      # "pass" against it forever regardless of vite.config.ts's globPatterns
      # — silently stop being a real gate. The OBS thumbnails must not be in
      # the service-worker precache (ADR 0006 / #177) — ~598 files stalling
      # the first native launch. Mirrors android-apk.yml's identical step: the
      # emitted thumbnails are checked against the reader-gated jpg policy
      # (#783). A reader landed with the Template Library (#246, #1655), so
      # `jpg` is configured and the thumbnails must be emitted; either one
      # without the other fails. This lane kept the old unconditional grep
      # until v1.2.1, and v1.2.0's Play run failed on it (#1750).
      - name: OBS thumbnails stay out of the precache (web build; ADR 0006 / #177)
        if: ${{ inputs.build_only || steps.guard.outputs.upload == 'true' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = readFileSync('vite.config.ts', 'utf8');
          // The raw file is read, comments and all, so a commented-out array
          // could be taken for the live one (#822). Refuse to choose instead.
          const found = [...config.matchAll(/globPatterns:\s*\[([^\]]*)\]/g)];
          if (found.length > 1) {
            console.error('::error::More than one globPatterns array in vite.config.ts (a commented-out copy?); this gate cannot tell which is live');
            process.exit(1);
          }
          const body = found[0]?.[1];
          const patterns = [...(body ?? '').matchAll(/"([^"]+)"/g)].map(m => m[1]);
          if (patterns.length === 0) {
            console.error('::error::No globPatterns found in vite.config.ts');
            process.exit(1);
          }
          const jpgConfigured = patterns.some(p => /\bjpe?g\b/i.test(p));
          const thumbnailsEmitted = readFileSync('dist/sw.js', 'utf8').includes('obs/thumbs');
          if (thumbnailsEmitted !== jpgConfigured) {
            console.error('::error::Emitted OBS thumbnails disagree with the reader-gated jpg policy');
            process.exit(1);
          }
          NODE

      # #923: the web build above validates the PWA's own artifacts, but what
      # actually ships inside the native shell — including a Play .aab — must
      # be the NATIVE-mode build: vite.config.ts's `--mode native` swaps
      # `dist/sw.js` for vite-plugin-pwa's self-destroying worker and ships no
      # auto-injected registration script, so the WebView never keeps an
      # offline precache that can go stale across an in-place upgrade. Before
      # this fix, this lane shipped the WEB build's Workbox precache worker
      # inside every .aab — the exact #923 defect. This deliberately
      # overwrites the dist/ the previous step just checked; `cap sync` below
      # copies whatever dist/ holds at that point, which must be this one, not
      # the web build's.
      - name: Rebuild and check dist/ for the native shell (self-destroying service worker, #923)
        if: ${{ inputs.build_only || steps.guard.outputs.upload == 'true' }}
        run: npm run test:dist:native

      - name: Sync dist/ into the Android project
        if: ${{ inputs.build_only || steps.guard.outputs.upload == 'true' }}
        run: |
          npx cap sync android
          node scripts/check-android-diagnostic.mjs android/app/src/main/assets/capacitor.config.json

      # Same ship-blockers as android-apk.yml's guard. A push to staging/main
      # has normally passed ci.yml via its PR, but this is what reaches
      # phones. The OBS-thumbnail policy is checked against the WEB build
      # above, not here — see that step's comment.
      - name: Guard the synced bundle
        if: ${{ inputs.build_only || steps.guard.outputs.upload == 'true' }}
        run: |
          set -euo pipefail
          test -f dist/sw.js || { echo "::error::dist/sw.js missing"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "::error::manifest missing"; exit 1; }
          for tok in "e2e-harness" "__e2e"; do
            if grep -rq "$tok" dist/; then
              echo "::error::e2e harness ($tok) leaked into dist/"
              exit 1
            fi
          done
          test -f android/app/src/main/assets/public/index.html \
            || { echo "::error::cap sync did not copy the web bundle into android/"; exit 1; }
          echo "Bundle built, clean, and synced into android/."

      # Decoded into a gitignored path: android/tc-mobile-upload.jks. Needed to
      # sign the .aab on every path, build_only included.
      - name: Write the upload keystore
        if: ${{ inputs.build_only || steps.guard.outputs.upload == 'true' }}
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          ruby -rbase64 -e 'File.binwrite("android/tc-mobile-upload.jks", Base64.decode64(ENV.fetch("PLAY_UPLOAD_KEYSTORE_BASE64")))'

      # Decoded into a gitignored path: fastlane/play-service-account.json.
      # Skipped on build_only — nothing after this step reads it there.
      - name: Write the Play service-account key
        if: ${{ !inputs.build_only && steps.guard.outputs.upload == 'true' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          ruby -rjson -e 'j = JSON.parse(ENV.fetch("PLAY_SERVICE_ACCOUNT_JSON")); abort("::error::PLAY_SERVICE_ACCOUNT_JSON is not a service_account key") unless j["type"] == "service_account"; File.write("fastlane/play-service-account.json", JSON.generate(j))'

      # versionCode: unix timestamp, same scheme as the APK lane, so a Play
      # build always outranks any sideloaded APK and vice versa by build time.
      # Play's ceiling is 2,100,000,000 — the timestamp reaches it on
      # 2036-07-18; switch schemes before then (docs/native/README.md §6).
      # android/app/build.gradle reads the ANDROID_* signing vars; here they
      # point at the UPLOAD key.
      - name: Build the release bundle
        if: ${{ inputs.build_only || steps.guard.outputs.upload == 'true' }}
        id: aab
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/tc-mobile-upload.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          code="$(date +%s)"
          cd android
          ./gradlew bundleRelease -PversionCode="$code" --no-daemon
          test -f app/build/outputs/bundle/release/app-release.aab \
            || { echo "::error::bundleRelease exited 0 but app-release.aab is missing"; exit 1; }
          version="$(node -p 'require("../package.json").version')"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "release_name=$version ($code) ${GITHUB_REF_NAME}@${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        if: ${{ !inputs.build_only && steps.guard.outputs.upload == 'true' }}
        env:
          PLAY_AAB_PATH: ${{ github.workspace }}/android/app/build/outputs/bundle/release/app-release.aab
          PLAY_JSON_KEY_PATH: ${{ github.workspace }}/fastlane/play-service-account.json
          PLAY_TRACK: ${{ needs.preflight.outputs.track }}
          PLAY_RELEASE_STATUS: ${{ needs.preflight.outputs.status }}
          PLAY_RELEASE_NAME: ${{ steps.aab.outputs.release_name }}
        run: bundle _2.6.9_ exec fastlane android play

      - name: Remove decoded credentials
        if: always()
        run: rm -f android/tc-mobile-upload.jks fastlane/play-service-account.json

      # Keep the exact bundle that was uploaded, for audit and for a manual
      # re-upload if Play rejected it for a console-side reason.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.aab.outcome == 'success'
        with:
          name: android-aab-${{ github.ref_name }}-${{ steps.aab.outputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
