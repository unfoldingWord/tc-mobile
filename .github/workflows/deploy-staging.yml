name: Deploy Staging

# Staging deploys as a direct consequence of a PR merging, so the deploy has
# PR-level provenance and can comment the URL back onto the PR.
# workflow_dispatch is kept as a manual recovery path.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [closed]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"

# Serialise staging deploys so two quick merges don't race; the later merge's
# artefact should win, so nothing is cancelled in flight.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # A close-without-merge leaves staging untouched.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment the staging URL on the merged PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const url = "https://tc-mobile-staging.unfoldingword.workers.dev";
            const sha = context.payload.pull_request.merge_commit_sha;
            const body = [
              `### Staging deploy complete`,
              ``,
              `**Worker:** \`tc-mobile-staging\``,
              `**URL:** ${url}`,
              `**Merge commit:** \`${sha}\``,
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
