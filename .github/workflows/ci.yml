name: CI

on:
  # Push CI runs on the long-lived branches only — merges land there and get no
  # pull_request event, so they need a push trigger. Feature branches get their
  # CI from the pull_request trigger below; gating push on them as well would
  # double-run every push to a branch that also has an open PR.
  push:
    branches: ["develop", "staging", "main"]
  pull_request:
    branches: ["**"]

# Least privilege by default; jobs opt in to what they need.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel only superseded PR runs. On the long-lived branches (develop, staging,
  # main) every merged commit must keep its own run: two merges landing close
  # together would otherwise leave the first commit with no completed CI.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.24.3
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the
      # release's published checksums.txt. A tampered or truncated download
      # fails the verification below instead of running an unknown binary.
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks ACTION derives its scan range from the push event, which
      # on a repository's first push resolves to `<root-commit>^..HEAD` — an
      # invalid revision. It then exits 1 having scanned ~0 bytes, which looks
      # like a failure but is really a scan that never happened. A secret scan
      # that fails open on the initial commit is backwards, since that commit
      # is the largest single import of code.
      #
      # Running the binary directly over full history is deterministic, covers
      # every commit including the root, and needs no licence key.
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --fail -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan full history
        run: ./gitleaks detect --source . --redact -v --exit-code 1

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The DOM-free half of the lib/ boundary. See tsconfig.lib.json.
      - name: Type check lib/ without the DOM
        run: npm run typecheck:lib

      - name: Unused files and dependencies
        run: npm run knip

      - name: Test
        run: npm test

      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Confirm the PWA artefacts were emitted
        # A build that silently stops producing a service worker or manifest
        # would leave the app installable-looking but not actually offline —
        # the one property this project cannot lose.
        run: |
          test -f dist/sw.js || { echo "::error::dist/sw.js missing"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "::error::manifest missing"; exit 1; }
          echo "PWA artefacts present."

      # The e2e smoke harness (#251) must never reach a shipped build. What
      # keeps it out is `vite.config.ts`'s `build.rollupOptions.external`, not
      # `main.tsx`'s `import.meta.env.MODE` guard — a runtime guard alone does
      # not stop Rollup discovering a dynamic `import()` target. Both are one
      # edit away from being loosened by someone who has not read either
      # comment, and until now the exclusion was asserted only in prose
      # (round-1 George G4). `grep -r` matching is the failure: found = leak.
      - name: Confirm the e2e harness did not leak into the build
        run: |
          if grep -rl "e2e-harness" dist/; then
            echo "::error::e2e harness leaked into production dist/"
            exit 1
          fi
          echo "No e2e harness in dist/."

      - name: Report bundle size
        run: |
          {
            echo "## Bundle size"
            echo ""
            echo "| File | Size |"
            echo "|------|------|"
            find dist/assets -name "*.js" -o -name "*.css" \
              | xargs du -h | sort -rh | head -10 \
              | while read -r size file; do echo "| \`${file#dist/}\` | $size |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: dist
          retention-days: 1

  # Headless-Chromium smoke for the browser-only paths (#251): the real
  # mp3.worker.ts round-trip, decodeAudioData of a stored MP3, the service
  # worker's atomic precache install, and a real two-tab IndexedDB
  # blocked/versionchange — none of which the Node/vitest suite above can see
  # by construction (lib/ is DOM-free on purpose). Gated to pull_request only,
  # and only when the browser-boundary code it exercises actually changed, so
  # a docs-only or components-only PR pays nothing for it.
  browser-smoke:
    name: Headless-Chromium Smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history: the paths check below diffs against the PR's merge
      # base, which a shallow (default depth-1) checkout does not have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A plain `git diff`, not a third-party Action: every other action in
      # this workflow is `actions/*`, pinned by SHA, and this repo has no
      # third-party action to date. A two-line diff does the same job without
      # adding one.
      # The gate must cover everything the suite actually exercises, not just
      # the hooks layer: the harness drives `src/lib/audio/` (mp3-align's
      # `fitMp3Decode`, edit's `fitToFrames`, the lamejs encoder body) and
      # `src/lib/storage/db.ts` (the real IndexedDB open the two-tab assertion
      # depends on), and the suite's own files decide what it asserts at all.
      # #236/#240 are the live example: they change `db.ts`'s blocked/
      # versionchange behaviour — which flips this suite's expected outcome —
      # and under the round-1 gate (`src/hooks/` or `vite.config.ts` only)
      # they would not have run it (round-1 Frank C2).
      #
      # `git diff` failing — a missing base SHA on a shallow checkout, say —
      # must fail the STEP. Piped straight into `grep` inside an `if`, a broken
      # diff and a genuinely empty one both read as "no match", so the suite
      # would silently skip and the run would look like a clean negative.
      - name: Changed paths
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "::error::pull_request base SHA is empty; cannot compute changed paths"
            exit 1
          fi
          # A separate assignment, so a non-zero `git diff` exits here under
          # `set -e` instead of being swallowed by the `if` below. The `grep`
          # then reads a here-string, not a pipe: no pipeline whose exit status
          # could be confused with the match result.
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -qE '^(src/hooks/|src/lib/audio/|src/lib/storage/|src/app/e2e-harness\.ts$|e2e/|playwright\.config\.ts$|vite\.config\.ts$|package\.json$|package-lock\.json$)' <<<"$changed"; then
            echo "smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "smoke=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changed.outputs.smoke == 'true'
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.changed.outputs.smoke == 'true'
        run: npm ci

      # A version-matched Chromium download — the standard approach on a
      # fresh Actions runner. This is NOT how the smoke suite launches
      # Chromium in the maintainers' sandboxed dev containers, which
      # pre-install a Chromium outside npm's browser cache and pin
      # `playwright.config.ts`'s `executablePath` to it instead; a runner has
      # neither that path nor a pinned-version mismatch to work around.
      - name: Install Playwright's Chromium
        if: steps.changed.outputs.smoke == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build (e2e) and run the smoke suite
        if: steps.changed.outputs.smoke == 'true'
        run: npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.changed.outputs.smoke == 'true' && failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 5
