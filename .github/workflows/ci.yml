name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

# Least privilege by default; jobs opt in to what they need.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Confirm the PWA artefacts were emitted
        # A build that silently stops producing a service worker or manifest
        # would leave the app installable-looking but not actually offline —
        # the one property this project cannot lose.
        run: |
          test -f dist/sw.js || { echo "::error::dist/sw.js missing"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "::error::manifest missing"; exit 1; }
          echo "PWA artefacts present."

      - name: Report bundle size
        run: |
          {
            echo "## Bundle size"
            echo ""
            echo "| File | Size |"
            echo "|------|------|"
            find dist/assets -name "*.js" -o -name "*.css" \
              | xargs du -h | sort -rh | head -10 \
              | while read -r size file; do echo "| \`${file#dist/}\` | $size |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: build
          path: dist
          retention-days: 1
