name: CI

on:
  # Push CI runs on the long-lived branches only — merges land there and get no
  # pull_request event, so they need a push trigger. Feature branches get their
  # CI from the pull_request trigger below; gating push on them as well would
  # double-run every push to a branch that also has an open PR.
  push:
    branches: ["develop", "staging", "main"]
  pull_request:
    branches: ["**"]

# Least privilege by default; jobs opt in to what they need.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel only superseded PR runs. On the long-lived branches (develop, staging,
  # main) every merged commit must keep its own run: two merges landing close
  # together would otherwise leave the first commit with no completed CI.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.24.3
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the
      # release's published checksums.txt. A tampered or truncated download
      # fails the verification below instead of running an unknown binary.
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks ACTION derives its scan range from the push event, which
      # on a repository's first push resolves to `<root-commit>^..HEAD` — an
      # invalid revision. It then exits 1 having scanned ~0 bytes, which looks
      # like a failure but is really a scan that never happened. A secret scan
      # that fails open on the initial commit is backwards, since that commit
      # is the largest single import of code.
      #
      # Running the binary directly over full history is deterministic, covers
      # every commit including the root, and needs no licence key.
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --fail -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan full history
        run: ./gitleaks detect --source . --redact -v --exit-code 1

  # #840 R3: a commit with a subject and no body has reached `develop` before
  # (#776; the review bench's fix-lane commits on #792 `7a41ee29d` and #793
  # `21108948e`), past AGENTS.md's "Conventions" rule (subject AND body,
  # neither blank) and past `.husky/commit-msg`, which only guards a commit
  # made in a checkout that ran `npm run prepare` — a PR opened from a
  # checkout where hooks were bypassed or never installed reaches here
  # ungated otherwise. `pull_request` only, per AGENTS.md's own rule for a
  # check that reads `base..head`: the equivalent `push` event has no PR base
  # to diff against, and a push to develop/staging/main is always a merge, not
  # an individual commit this check would ever fail.
  commit-messages:
    name: Commit Messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history: `--range` below needs the merge base, which a shallow
      # (default depth-1) checkout does not have. Same reasoning as
      # browser-smoke's "Changed paths" step below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # `github.sha` on a `pull_request` event is GitHub's synthetic merge
      # ref (refs/pull/N/merge), which contains the base branch's CURRENT
      # tip, not just this PR's commits — and `pull_request.base.sha` can be
      # older than that tip by the time CI runs. Diffing `base.sha..github.sha`
      # therefore sweeps in every commit already merged to the base branch
      # since the PR's base snapshot was taken (#865 follow-up, observed on
      # PR #869 run 36033907345: the gate failed on four bodyless commits
      # already on `develop` — via #875, #870, #852 — that #869 never
      # introduced). Fetching `origin/<base_ref>` live and diffing it against
      # `pull_request.head.sha` (the PR branch's own tip, never the
      # synthetic merge ref) judges only the PR's own commits, whether the
      # PR was branched from an old `develop` or has since merged `develop`
      # back in. See tests/ci-commit-messages-range.test.ts, which pins this
      # exact wiring.
      #
      # For a PR whose base is `staging` or `main` (a promotion, or a
      # hotfix), `origin/$BASE_REF..$HEAD_SHA` above is every commit since
      # the LAST promotion — commits already judged by develop's own gate,
      # or that predate this gate entirely (#891, #889: 20 such commits on
      # the first `develop -> staging` promotion this gate ever saw). Giving
      # them bodies would mean rewriting develop's history, which this repo
      # does not do, so a promotion could never pass. Diffing against
      # `origin/develop` instead correctly excludes all of that — every
      # commit on develop has already been judged by develop's own gate, or
      # predates it — while still catching a hotfix commit that is NOT on
      # develop (branched off staging directly, or added after branching):
      # that commit is not reachable from `origin/develop` either, so it
      # still shows up in `origin/develop..$HEAD_SHA`. A PR into develop (or
      # anything else) is unchanged.
      - name: Check PR commits for a non-blank body
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$BASE_REF" = "staging" ] || [ "$BASE_REF" = "main" ]; then
            git fetch origin develop
            node scripts/check-commit-messages.mjs --range "origin/develop..$HEAD_SHA"
          else
            git fetch origin "$BASE_REF"
            node scripts/check-commit-messages.mjs --range "origin/$BASE_REF..$HEAD_SHA"
          fi

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The DOM-free half of the lib/ boundary. See tsconfig.lib.json.
      - name: Type check lib/ without the DOM
        run: npm run typecheck:lib

      - name: Unused files and dependencies
        run: npm run knip

      - name: Test
        run: npm test

      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Confirm the PWA artefacts were emitted
        # A build that silently stops producing a service worker or manifest
        # would leave the app installable-looking but not actually offline —
        # the one property this project cannot lose. `version.json` is checked
        # here too (round-1 George G1): `scripts/check-deploy.mjs` and the
        # whole "Confirming a deploy" runbook (AGENTS.md) depend on every real
        # build emitting it, and nothing else was asserting that.
        run: |
          test -f dist/sw.js || { echo "::error::dist/sw.js missing"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "::error::manifest missing"; exit 1; }
          test -f dist/version.json || { echo "::error::dist/version.json missing"; exit 1; }
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("dist/version.json", "utf8"));
            if (typeof v.version !== "string" || typeof v.sha !== "string") {
              console.error("::error::dist/version.json is missing a string version/sha field:", JSON.stringify(v));
              process.exit(1);
            }
          '
          echo "PWA artefacts present."

      - name: version.json stays out of the precache manifest
        # tests/precache-manifest.test.ts's "never contains version.json"
        # assertion reads dist/sw.js directly, and runs only under
        # `npm run test:dist`, which guarantees a build first (#568); the
        # Quality job's `npm test` skips it by design. This grep is a second,
        # independent reader of the same build output, so the invariant does
        # not rest on one mechanism: version.json must stay
        # outside `workbox.globPatterns` (vite.config.ts) so `check:deploy`'s
        # fetch (and a browser's) always reaches the origin, never a
        # service-worker-cached copy (see "Confirming a deploy" in
        # AGENTS.md). `-F` (fixed string) matters here: the emitted
        # `navigateFallbackDenylist` regex source contains the *escaped*
        # substring `version\.json` (backslash then dot), which a literal
        # search for `version.json` does not match — only an actual
        # `url:"version.json"` precache-manifest entry would.
        run: |
          if grep -qF "version.json" dist/sw.js; then
            echo "::error::dist/sw.js's precache manifest contains version.json — it must stay outside workbox.globPatterns in vite.config.ts so a deploy check (and a browser) always fetches it from the origin, never a cached copy. See tests/precache-manifest.test.ts and AGENTS.md, 'Confirming a deploy and rolling one back'."
            exit 1
          fi
          echo "version.json absent from dist/sw.js's precache manifest."

      - name: OBS thumbnails stay out of the precache manifest
        # tests/precache-manifest.test.ts pins `workbox.globPatterns` in
        # vite.config.ts, but a re-add via vite-plugin-pwa's `includeAssets`
        # or `additionalManifestEntries` reaches the generated manifest
        # without touching globPatterns at all, so that test would not see it
        # (#219). This greps the actual build output instead: the source of
        # truth for what a field install fetches. See ADR 0006 / #177 for why
        # the thumbnails are reader-gated out of the precache today.
        #
        # This check is an UNCONDITIONAL ban on the substring, not a two-state
        # reader-gated check like tests/precache-manifest.test.ts — bash has
        # no cheap equivalent of that test's source scan for a reader. That is
        # deliberate, not an oversight (#232 round-1 review, finding C2): it
        # is a hard stop that WILL fail once a real reader lands (Template
        # Library, #33) and `jpg` is legitimately restored to the precache.
        # At that point this step itself is the third place to update or
        # remove — alongside `tests/precache-manifest.test.ts`'s `INTENDED`
        # and `vite.config.ts`'s `globPatterns` — not a bug to silently work
        # around by loosening or deleting the grep without also updating the
        # other two.
        run: |
          if grep -q "obs/thumbs" dist/sw.js; then
            echo "::error::dist/sw.js precaches obs/thumbs — the thumbnails are reader-gated out of the precache (ADR 0006 / #177) until a screen reads them. If a reader has legitimately landed (e.g. the Template Library, #33), this is expected: update INTENDED in tests/precache-manifest.test.ts, globPatterns in vite.config.ts, AND this grep step in ci.yml together — this step is an unconditional ban and must change too, or every build after the restore fails here."
            exit 1
          fi
          echo "obs/thumbs absent from dist/sw.js."

      # tests/dist-css.test.ts and tests/precache-manifest.test.ts's
      # `dist/sw.js`-reading block both read the actual build output, so they
      # are meaningless anywhere a build has not just happened — the Quality
      # job runs `npm test` before this job's `npm run build` exists, and
      # they skip there by design. This step is the one place they run.
      #
      # `npm run test:dist` is that single sanctioned caller, shared with
      # `npm run verify` and `.husky/pre-push` so there is one definition of
      # "after a build" rather than three. It sets `REQUIRE_DIST_BUILD=1`,
      # which turns each file's "fails, not skips, when required to find a
      # build and does not" case from a no-op into a real assertion: point
      # this same command at a tree with no `dist/` and it goes red, so a
      # build step that silently stopped producing output is caught rather
      # than skipped past.
      #
      # Nothing here gates on whether `dist/` merely happens to exist — that
      # is what made the suite's tally depend on leftover state (#568). The
      # variable decides, and only this script sets it.
      - name: Build-artifact tests actually run here, not just skip
        run: npm run test:dist

      # The e2e smoke harness (#251) must never reach a shipped build. What
      # keeps it out is `vite.config.ts`'s `build.rollupOptions.external`, not
      # `main.tsx`'s `import.meta.env.MODE` guard — a runtime guard alone does
      # not stop Rollup discovering a dynamic `import()` target. Both are one
      # edit away from being loosened by someone who has not read either
      # comment, and until now the exclusion was asserted only in prose
      # (round-1 George G4). `grep -r` matching is the failure: found = leak.
      #
      # TWO tokens, because either one alone has a bypass (round-2 George G-2):
      #
      #   `e2e-harness` is the module id, and it survives a leak only as a
      #   CHUNK FILENAME (`assets/e2e-harness-*.js`) — that is, only while the
      #   dynamic `import()` keeps the harness in a chunk of its own. It is not
      #   a runtime string inside `src/app/e2e-harness.ts`. Drop
      #   `vite.config.ts`'s `external` marker AND make `main.tsx`'s import
      #   static, and Rollup inlines the harness into the entry chunk: no such
      #   filename anywhere, and this check alone reports "no leak" on a build
      #   that shipped the harness.
      #
      #   `__e2e` is the property the harness assigns on `window`. A minifier
      #   renames locals; it cannot rename a property accessed by name, so this
      #   token follows the CODE rather than the chunk-splitting artefact, and
      #   catches the inlined case the first token misses.
      #
      # Both are checked, and either match fails the step.
      - name: Confirm the e2e harness did not leak into the build
        run: |
          set -euo pipefail
          leaked=0
          if grep -rl "e2e-harness" dist/; then
            echo "::error::e2e harness chunk leaked into production dist/"
            leaked=1
          fi
          if grep -rl "__e2e" dist/; then
            echo "::error::e2e harness code (window.__e2e) leaked into production dist/"
            leaked=1
          fi
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi
          echo "No e2e harness in dist/."

      - name: Report bundle size
        run: |
          {
            echo "## Bundle size"
            echo ""
            echo "| File | Size |"
            echo "|------|------|"
            find dist/assets -name "*.js" -o -name "*.css" \
              | xargs du -h | sort -rh | head -10 \
              | while read -r size file; do echo "| \`${file#dist/}\` | $size |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: dist
          retention-days: 1

  # Headless-Chromium smoke for the browser-only paths (#251): the real
  # mp3.worker.ts round-trip, decodeAudioData of the worker's in-memory MP3
  # output (not the IndexedDB clipData round-trip, which the Node/fake-indexeddb
  # suite already covers), the service worker's atomic precache install, and a
  # real two-tab IndexedDB blocked/versionchange — and, since #205, the durable
  # failure log driven through the real UI of the shipped `dist/` build. None of
  # which the Node/vitest suite above can see by construction (lib/ is DOM-free
  # on purpose). Gated to pull_request only, and only when the code it exercises
  # actually changed, so a docs-only PR pays nothing for it.
  browser-smoke:
    name: Headless-Chromium Smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history: the paths check below diffs against the PR's merge
      # base, which a shallow (default depth-1) checkout does not have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A plain `git diff`, not a third-party Action: every other action in
      # this workflow is `actions/*`, pinned by SHA, and this repo has no
      # third-party action to date. A two-line diff does the same job without
      # adding one.
      # The gate must cover everything the suite actually exercises, not just
      # the hooks layer: the harness drives `src/lib/audio/` (mp3-align's
      # `fitMp3Decode`, edit's `fitToFrames`, the lamejs encoder body) and
      # `src/lib/storage/db.ts` (the real IndexedDB open the two-tab assertion
      # depends on), and the suite's own files decide what it asserts at all.
      # #236/#240 are the live example: they change `db.ts`'s blocked/
      # versionchange behaviour — which flips this suite's expected outcome —
      # and under the round-1 gate (`src/hooks/` or `vite.config.ts` only)
      # they would not have run it (round-1 Frank C2).
      #
      # `src/app/main.tsx` was in the gate for the same reason and is easy to
      # miss: it is the ONLY production loader of the harness (the
      # `import.meta.env.MODE === "e2e"` dynamic `import()` at its foot). A PR
      # that deletes or breaks just that branch changes no other gated path, so
      # without that entry the gate reads `smoke=false`, Playwright never runs,
      # and CI goes green while `window.__e2e` has silently stopped loading —
      # every spec here would fail on the next PR that did trip the gate
      # (round-2 Frank F2 / George G-3).
      #
      # THE SOURCE HALF OF THIS FILTER IS A PLAIN `src/`, and two independent
      # lanes arrived there within a day of each other — which is the strongest
      # thing that can be said for it.
      #
      # #205's `e2e/failure-log.spec.ts` and #171's `e2e/theme-toggle.spec.ts`
      # both load `/` from the shipped `dist/` build and assert the real UI, so
      # neither has a dependency set smaller than the whole app graph reachable
      # from `main.tsx`. The per-directory list was derivable only while every
      # spec drove either the harness or the service worker.
      #
      # Each lane also has its own worked example of the list failing:
      #
      #   - #205: a components-only PR that removed the ≡ marker (or the
      #     panel's mount, which is one `count > 0` away) would, under the old
      #     list, have skipped all thirteen of its cases and merged green.
      #   - #171: an enumerated list was tried and was wrong within one review
      #     round. It named `src/lib/theme.ts`, `books-screen.tsx`,
      #     `strings.ts`, `src/app/styles/` and `index.html` — each genuinely a
      #     dependency — and still returned `smoke=false` for
      #     `src/app/globals.css` (where the `@theme` colour bridge and the
      #     `@import` of the whole style layer live), `src/app/App.tsx` (which
      #     decides whether `BooksScreen` is mounted at all), `menu.tsx` (which
      #     renders the toggle's children) and `control.tsx` (which IS the
      #     toggle). That was the second such miss; round-1 Frank C2 was the
      #     first.
      #
      # Both are the "a gate is tested in both states" failure AGENTS.md names,
      # in the shape where the gate is simply never reached — and the failure
      # mode is silent, because a skipped browser gate looks exactly like a
      # passing one. Over-running this suite costs a few minutes; under-running
      # it is the defect. `docs/**` and `*.md` still pay nothing.
      #
      # Still enumerated, because these are NOT under `src/` and each is a real
      # dependency: `index.html` (the `meta[name="theme-color"]` the theme spec
      # reads, and the viewport policy `tests/touch-policy.test.ts` gates),
      # `e2e/` and `playwright.config.ts` (the suites and their projects),
      # `vite.config.ts` (which decides what `dist/` and `dist-e2e/` contain at
      # all) and the two lockfile/manifest paths.
      #
      # `tests/smoke-path-filter.test.ts` reads this exact regex out of this
      # file and pins BOTH gate states.
      #
      # `git diff` failing — a missing base SHA on a shallow checkout, say —
      # must fail the STEP. Piped straight into `grep` inside an `if`, a broken
      # diff and a genuinely empty one both read as "no match", so the suite
      # would silently skip and the run would look like a clean negative.
      - name: Changed paths
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "::error::pull_request base SHA is empty; cannot compute changed paths"
            exit 1
          fi
          # A separate assignment, so a non-zero `git diff` exits here under
          # `set -e` instead of being swallowed by the `if` below. The `grep`
          # then reads a here-string, not a pipe: no pipeline whose exit status
          # could be confused with the match result.
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -qE '^(src/|index\.html$|e2e/|playwright\.config\.ts$|vite\.config\.ts$|package\.json$|package-lock\.json$)' <<<"$changed"; then
            echo "smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "smoke=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changed.outputs.smoke == 'true'
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        if: steps.changed.outputs.smoke == 'true'
        run: npm ci

      # A version-matched Chromium download — the standard approach on a
      # fresh Actions runner. This is NOT how the smoke suite launches
      # Chromium in the maintainers' sandboxed dev containers, which
      # pre-install a Chromium outside npm's browser cache and pin
      # `playwright.config.ts`'s `executablePath` to it instead; a runner has
      # neither that path nor a pinned-version mismatch to work around.
      - name: Install Playwright's Chromium
        if: steps.changed.outputs.smoke == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build (e2e) and run the smoke suite
        if: steps.changed.outputs.smoke == 'true'
        run: npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.changed.outputs.smoke == 'true' && failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 5
