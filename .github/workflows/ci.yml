name: CI

on:
  # `**` matches slashes; a single `*` does NOT, so `feat/x`-style branches
  # pushed without a PR would otherwise get no CI run at all.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least privilege by default; jobs opt in to what they need.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel only superseded PR runs. On the long-lived branches (develop, staging,
  # main) every merged commit must keep its own run: two merges landing close
  # together would otherwise leave the first commit with no completed CI.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.24.3
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the
      # release's published checksums.txt. A tampered or truncated download
      # fails the verification below instead of running an unknown binary.
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # The gitleaks ACTION derives its scan range from the push event, which
      # on a repository's first push resolves to `<root-commit>^..HEAD` — an
      # invalid revision. It then exits 1 having scanned ~0 bytes, which looks
      # like a failure but is really a scan that never happened. A secret scan
      # that fails open on the initial commit is backwards, since that commit
      # is the largest single import of code.
      #
      # Running the binary directly over full history is deterministic, covers
      # every commit including the root, and needs no licence key.
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --fail -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan full history
        run: ./gitleaks detect --source . --redact -v --exit-code 1

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The DOM-free half of the lib/ boundary. See tsconfig.lib.json.
      - name: Type check lib/ without the DOM
        run: npm run typecheck:lib

      - name: Unused files and dependencies
        run: npm run knip

      - name: Test
        run: npm test

      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Confirm the PWA artefacts were emitted
        # A build that silently stops producing a service worker or manifest
        # would leave the app installable-looking but not actually offline —
        # the one property this project cannot lose.
        run: |
          test -f dist/sw.js || { echo "::error::dist/sw.js missing"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "::error::manifest missing"; exit 1; }
          echo "PWA artefacts present."

      - name: Report bundle size
        run: |
          {
            echo "## Bundle size"
            echo ""
            echo "| File | Size |"
            echo "|------|------|"
            find dist/assets -name "*.js" -o -name "*.css" \
              | xargs du -h | sort -rh | head -10 \
              | while read -r size file; do echo "| \`${file#dist/}\` | $size |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build
          path: dist
          retention-days: 1
